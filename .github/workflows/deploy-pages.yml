name: Deploy to GitHub Pages

# 电脑小百科 · 技术笔记 静态站部署
#
# 流程：push 时把仓库里的 dist/ 打包上传 → GitHub Pages 只发布 dist/。
#       PHP 源码（含数据库配置）永远不会出现在 Pages 上，仓库公开也安全。
#
# 注意：本仓库的 Pages Source 是「Deploy from a branch」（Jekyll 直接渲染根目录）。
#       只要在 Settings → Pages → Source 切到「GitHub Actions」，本工作流即可接管；
#       切换之前 Pages 由分支构建兜底，与本工作流互不干扰。

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Upload dist/ for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
